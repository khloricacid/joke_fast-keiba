<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ファスト競馬</title>
<meta name="description" content="5秒で決着する架空の3D競馬ゲーム(ジョークサイト)。URLを送るだけで友だちと同じレースに賭けられます。コインはゲーム内ポイントのみ。">
<meta name="theme-color" content="#0a0e24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20">
</head>
<body class="is-bet">
<canvas id="gl" aria-hidden="true"></canvas>
<div class="bar top" aria-hidden="true"></div>
<div class="bar bottom" aria-hidden="true"></div>
<div id="vig" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="frame" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div id="omen" aria-hidden="true"><small>確定演出</small><b>激アツ!!</b><i>この馬、くるぞ</i></div>
<div id="legend" aria-hidden="true"><i class="cross"></i><i class="crack"></i><div class="gogo"><b>ゴ</b><b>ゴ</b><b>ゴ</b><b>ゴ</b><b>ゴ</b><b>ゴ</b></div><i class="wave w1"></i><i class="wave w2"></i><i class="lgRays"></i><svg class="ownerArt" viewBox="0 0 400 400" aria-hidden="true">
  <defs>
    <radialGradient id="owSpot" cx="50%" cy="20%" r="65%"><stop offset="0" stop-color="#fff3c4" stop-opacity=".55"/><stop offset=".55" stop-color="#ffcf5a" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="owGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".4" stop-color="#ffe39a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb300" stop-opacity="0"/></radialGradient>
  </defs>
  <path class="owSpot" d="M150 -10 L250 -10 L380 400 L20 400 Z" fill="url(#owSpot)"/>
  <g class="owFig">
    <path d="M70 400 C78 318 130 284 200 280 C270 284 322 318 330 400 Z" fill="#17161f" stroke="#e8b23a" stroke-width="2.5"/>
    <path d="M176 284 L200 340 L224 284 Z" fill="#f4f1ea"/>
    <path d="M186 292 L200 300 L214 292 L214 308 L200 300 L186 308 Z" fill="#d6262f"/>
    <path d="M200 340 L200 400" stroke="#0c0b12" stroke-width="2"/>
    <circle cx="200" cy="228" r="44" fill="#e2bd98" stroke="#e8b23a" stroke-width="2"/>
    <path d="M168 248 C180 238 192 244 200 247 C208 244 220 238 232 248 C222 258 208 252 200 250 C192 252 178 258 168 248 Z" fill="#2a1d14"/>
    <circle cx="184" cy="224" r="4.5" fill="#1a120c"/><circle cx="216" cy="224" r="4.5" fill="#1a120c"/>
    <path d="M176 214 L192 211 M208 211 L224 214" stroke="#2a1d14" stroke-width="4" stroke-linecap="round"/>
    <rect x="160" y="118" width="80" height="74" rx="4" fill="#111018" stroke="#e8b23a" stroke-width="2"/>
    <rect x="160" y="172" width="80" height="11" fill="#c9a24a"/>
    <ellipse cx="200" cy="191" rx="66" ry="11" fill="#111018" stroke="#e8b23a" stroke-width="2"/>
  </g>
  <g class="owHand">
    <circle class="owPalmGlow" cx="0" cy="0" r="120" fill="url(#owGlow)"/>
    <path d="M-34 70 L-30 34 L30 34 L34 70 Z" fill="#17161f" stroke="#e8b23a" stroke-width="2"/>
    <rect x="-33" y="24" width="66" height="14" rx="3" fill="#f4f1ea"/>
    <path d="M-30 26 C-38 0 -36 -26 -30 -34 L30 -34 C36 -26 38 0 30 26 Z" fill="#fff" stroke="#9a9488" stroke-width="2"/>
    <rect x="-30" y="-88" width="14" height="60" rx="7" fill="#fff" stroke="#9a9488" stroke-width="2"/>
    <rect x="-14" y="-98" width="14" height="70" rx="7" fill="#fff" stroke="#9a9488" stroke-width="2"/>
    <rect x="2" y="-94" width="14" height="66" rx="7" fill="#fff" stroke="#9a9488" stroke-width="2"/>
    <rect x="18" y="-80" width="13" height="54" rx="6.5" fill="#fff" stroke="#9a9488" stroke-width="2"/>
    <rect x="-48" y="-33" width="15" height="48" rx="7.5" fill="#fff" stroke="#9a9488" stroke-width="2" transform="rotate(-29 -41 -10)"/>
    <path d="M-12 -6 C-4 2 4 2 12 -6 M-14 10 C-4 16 4 16 14 10" stroke="#d8d2c4" stroke-width="2" fill="none"/>
  </g>
</svg><div class="chars"><b>伝</b><b>説</b></div><div class="lgWho"><i class="face" id="lgFace"></i><span id="lgWho"></span></div><p class="lgName" id="lgName"></p></div>

<div class="hud">
  <div class="tags" id="tags" aria-hidden="true"></div>

  <header class="top" id="top">
    <div class="brand">
      <h1 class="logo">ファスト競馬</h1>
      <span class="tag">ドパガキ専用・5秒決着</span>
    </div>
    <div class="meta">
      <div class="lv"><span id="lvText">Lv.1 ドパ見習い</span><i class="xp"><i id="xpBar"></i></i></div>
      <span class="raceNo" id="raceNo">第1R</span>
      <span class="fever" id="fever" hidden></span>
      <span class="rush" id="rush" hidden></span>
      <div class="jp" title="ハズレの一部が積み立てられ、万馬券級の的中で全部もらえます"><span>ジャックポット</span><b id="jpVal">5,000</b></div>
      <div class="wallet" id="wallet"><span>所持コイン</span><b id="coins">1,000</b></div>
    </div>
    <div class="tools">
      <button type="button" id="btnRoom" aria-pressed="false" aria-controls="room">友だちを呼ぶ</button>
      <button type="button" id="btnRec" aria-haspopup="dialog">実績<i class="dot" id="recDot" hidden></i></button>
      <button type="button" id="btnMenu" aria-expanded="false" aria-controls="menu">メニュー</button>
    </div>
    <div class="menu" id="menu" hidden>
      <button type="button" id="btnBgm" aria-pressed="true">BGM</button>
      <button type="button" id="btnSfx" aria-pressed="true">効果音</button>
      <button type="button" id="btnFx" aria-pressed="true">演出全開</button>
      <button type="button" id="btnTts" aria-pressed="false">実況の読み上げ</button>
      <a href="db.html">馬と騎手のデータ</a>
      <button type="button" id="btnAbout">このサイトについて</button>
    </div>
  </header>

  <div class="map" id="map" aria-hidden="true"><i class="goal"></i></div>
  <div class="caster" id="caster" aria-live="polite"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="replayTag" aria-hidden="true">REPLAY</div>

  <div id="skillin" aria-hidden="true"><div class="band"><i class="face" id="skFace"></i><div class="txt"><small id="skWho"></small><b id="skName"></b></div><em id="skGrade"></em></div></div>
  <div class="skillbar" id="skillbar" aria-live="polite"></div>
  <div id="cutin" aria-hidden="true"><span class="no" id="cutNo"></span><b id="cutName"></b><i id="cutSay"></i></div>

  <div class="live" id="live" aria-hidden="true">
    <div class="callouts" id="callouts"></div>
    <div class="rank" id="rank"></div>
    <div class="stakeInfo" id="stakeInfo"></div>
  </div>

  <div id="say" aria-live="polite"><i class="face" id="sayFace"></i><div><b id="sayWho"></b><span id="sayText"></span></div></div>

  <div class="dan" id="dan" aria-hidden="true"></div>

  <div class="pop" id="pop" aria-live="polite">
    <b id="popA"></b><i id="popB"></i><em id="popC"></em>
    <div class="board" id="board" hidden></div>
    <div class="lucky" id="lucky" hidden>
      <p>救済くじチャンス!</p>
      <div class="reels"><span></span><span></span><span></span></div>
      <p class="res" id="luckyRes"></p>
    </div>
  </div>

  <section class="sheet" id="sheet" aria-label="投票">
    <div class="call" id="call">
      <span id="callText">馬をタップ。その瞬間に発走</span>
      <span class="fuse" id="fuse"></span>
    </div>
    <div class="stake" role="group" aria-label="賭け金">
      <span>賭け金</span>
      <button class="chip" type="button" data-bet="1000" aria-pressed="true">1000</button>
      <button class="chip" type="button" data-bet="2000" aria-pressed="false">2000</button>
      <button class="chip" type="button" data-bet="5000" aria-pressed="false">5000</button>
      <button class="chip" type="button" data-bet="10000" aria-pressed="false">1万</button>
      <button class="chip custom" type="button" data-bet="custom" id="chipCustom" aria-pressed="false" aria-haspopup="dialog">金額…</button>
      <button class="chip" type="button" data-bet="all" aria-pressed="false">全ツッパ</button>
      <span class="combo" id="combo" title="続けて賭けるとたまります。満タンの次のレースは払戻×1.3"><em>COMBO</em><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="bashira" id="bashira" role="group" aria-label="出走馬。タップで単勝に賭ける"></div>
    <p class="foot">↑↓は調子、★は騎手の特殊能力が出やすい印、緑の下線は騎手の得意脚質が合う印。架空のジョークゲームで、賭けるのはゲーム内コインだけです。</p>
  </section>

  <aside class="room" id="room" aria-label="部屋">
    <div class="roomHead">
      <h2>場内</h2>
      <button type="button" class="roomClose" id="roomClose">閉じる</button>
      <p class="net" id="net">接続の準備中</p>
      <p class="diag" id="diag"></p>
    </div>
    <label class="nick" for="nick">名前
      <input id="nick" type="text" maxlength="10" autocomplete="off" spellcheck="false">
    </label>
    <ol class="players" id="players"></ol>
    <p class="todayBest" id="todayBest"></p>
    <div class="invite">
      <button type="button" id="btnCopy">招待リンクをコピー</button>
      <button type="button" id="btnNew">専用の部屋を作る</button>
      <input id="inviteUrl" type="text" readonly aria-label="招待リンク" hidden>
    </div>
    <div class="stamps" id="stamps" role="group" aria-label="ヤジを飛ばす"></div>
  </aside>
</div>

<div class="modal" id="rec" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="recTitle">
    <header class="mhead"><h2 id="recTitle">ミッションと実績</h2><button type="button" class="mclose" data-close>閉じる</button></header>
    <div class="tabs" role="tablist" aria-label="表示の切り替え">
      <button type="button" role="tab" id="t-mis" aria-controls="p-mis" aria-selected="true">今日のミッション</button>
      <button type="button" role="tab" id="t-ach" aria-controls="p-ach" aria-selected="false">実績 <span id="achCount"></span></button>
      <button type="button" role="tab" id="t-rec" aria-controls="p-rec" aria-selected="false">戦績</button>
    </div>
    <div class="mbody">
      <div class="tabp" id="p-mis" role="tabpanel" aria-labelledby="t-mis"></div>
      <div class="tabp" id="p-ach" role="tabpanel" aria-labelledby="t-ach" hidden></div>
      <div class="tabp" id="p-rec" role="tabpanel" aria-labelledby="t-rec" hidden></div>
    </div>
  </div>
</div>

<div class="modal" id="betIn" hidden>
  <div class="mbox small" role="dialog" aria-modal="true" aria-labelledby="betInTitle">
    <header class="mhead"><h2 id="betInTitle">賭け金を決める</h2><button type="button" class="mclose" data-close>閉じる</button></header>
    <div class="mbody">
      <p class="lead" id="betInHave"></p>
      <input class="betInput" id="betInVal" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="例: 30000 / 3万" aria-label="賭け金">
      <div class="betQuick"><button type="button" data-q="half">半分</button><button type="button" data-q="x2">×2</button><button type="button" data-q="x10">×10</button><button type="button" data-q="max">全部</button></div>
      <p class="betErr" id="betInErr" aria-live="polite"></p>
      <button type="button" class="bigBtn" id="betInOk">この金額にする</button>
    </div>
  </div>
</div>
<div class="modal" id="bonus" hidden>
  <div class="mbox small" role="dialog" aria-modal="true" aria-labelledby="bonusTitle">
    <header class="mhead gold"><h2 id="bonusTitle">ログインボーナス</h2></header>
    <div class="mbody">
      <p class="bonusDay" id="bonusDay"></p>
      <ol class="week" id="bonusWeek"></ol>
      <p class="bonusVal" id="bonusVal"></p>
      <button type="button" class="bigBtn" data-close>受け取る</button>
    </div>
  </div>
</div>

<script src="about.js?v=1"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/net.js?v=2" async></script>
<script src="data.js?v=3"></script>
<script src="achievements.js?v=6"></script>
<script src="game.js?v=19"></script>
</body>
</html>
